name: Shared Compilation Engine

on:
  workflow_call:
    inputs:
      gradle_task:
        required: true
        type: string
        description: "The root Gradle task to execute (e.g. :theme:build)"
      artifact_path:
        required: true
        type: string
        description: "Path to built JAR files (e.g. CustomMods/theme/build/libs/*.jar)"
      artifact_name:
        required: true
        type: string
        description: "The name of the stashed zip file artifact"
      release_tag:
        required: false
        type: string
        default: ""

jobs:
  execute-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject Release Version
        if: ${{ inputs.release_tag != '' }}
        run: |
          chmod +x .github/scripts/update-version.sh
          .github/scripts/update-version.sh "${{ inputs.release_tag }}"

      # Execute directly inside the CustomMods root directory where gradlew lives
      - name: Build Mod Project
        working-directory: CustomMods
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.gradle_task }}

      - name: Stash Built Elements
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}